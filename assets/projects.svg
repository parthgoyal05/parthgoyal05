<svg width="100%" height="100%" viewBox="0 0 1120 620" fill="none" xmlns="http://www.w3.org/2000/svg"
  shape-rendering="geometricPrecision" text-rendering="geometricPrecision" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A1F14"/>
      <stop offset="100%" stop-color="#1E1510"/>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="80" x2="1000" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DEE8CE"/>
      <stop offset="45%" stop-color="#BB6653"/>
      <stop offset="100%" stop-color="#F08B51"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C1F14"/>
      <stop offset="100%" stop-color="#1A1208"/>
    </linearGradient>

    <style>
      .cardTitle { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1120" height="620" fill="url(#bg)"/>

  <rect x="20" y="20" width="1080" height="580" rx="28"
        fill="url(#cardFill)" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Top left card — Customer Segmentation -->
  <rect x="48" y="48" width="490" height="240" rx="22"
        fill="#251A10" stroke="#DEE8CE" stroke-opacity="0.55" stroke-width="1.2"/>
  <rect x="48" y="48" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.85"/>
  <text x="74" y="105" class="cardTitle" fill="#FFF8E8">📦 Customer Segmentation</text>
  <text x="74" y="136" class="body" fill="#FFF8E8" opacity="0.92">RFM-based classification into 11 customer segments;</text>
  <text x="74" y="158" class="body" fill="#FFF8E8" opacity="0.92">identified high-value &amp; churn-risk groups with</text>
  <text x="74" y="180" class="body" fill="#FFF8E8" opacity="0.92">interactive Tableau dashboard for behavior analysis.</text>

  <rect x="74" y="205" rx="10" width="68" height="26" fill="#BB6653" opacity="0.95"/>
  <rect x="150" y="205" rx="10" width="68" height="26" fill="#F08B51" opacity="0.95"/>
  <rect x="226" y="205" rx="10" width="72" height="26" fill="#DEE8CE" opacity="0.90"/>
  <text x="108" y="222" text-anchor="middle" class="pill" fill="#FFF8E8">Python</text>
  <text x="184" y="222" text-anchor="middle" class="pill" fill="#FFF8E8">Tableau</text>
  <text x="262" y="222" text-anchor="middle" class="pill" fill="#2A1F14">Pandas</text>

  <!-- Top right card — Dubai Real Estate -->
  <rect x="582" y="48" width="490" height="240" rx="22"
        fill="#251A10" stroke="#BB6653" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="582" y="48" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
  <text x="608" y="105" class="cardTitle" fill="#FFF8E8">🏙️ Dubai Real Estate Dashboard</text>
  <text x="608" y="136" class="body" fill="#FFF8E8" opacity="0.92">Dynamic filters, maps &amp; drill-down visualizations;</text>
  <text x="608" y="158" class="body" fill="#FFF8E8" opacity="0.92">25% faster analysis turnaround via automated KPI</text>
  <text x="608" y="180" class="body" fill="#FFF8E8" opacity="0.92">visualization across pricing, location &amp; property type.</text>

  <rect x="608" y="205" rx="10" width="72" height="26" fill="#BB6653" opacity="0.95"/>
  <rect x="688" y="205" rx="10" width="82" height="26" fill="#DEE8CE" opacity="0.90"/>
  <text x="644" y="222" text-anchor="middle" class="pill" fill="#FFF8E8">Tableau</text>
  <text x="729" y="222" text-anchor="middle" class="pill" fill="#2A1F14">Dashboards</text>

  <!-- Bottom left card — Strava Fitness -->
  <rect x="48" y="320" width="490" height="240" rx="22"
        fill="#251A10" stroke="#DEE8CE" stroke-opacity="0.55" stroke-width="1.2"/>
  <rect x="48" y="320" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
  <text x="74" y="377" class="cardTitle" fill="#FFF8E8">🏃 Strava Fitness Data Analysis</text>
  <text x="74" y="408" class="body" fill="#FFF8E8" opacity="0.92">Multi-source dataset cleaning; EDA on activity, sleep</text>
  <text x="74" y="430" class="body" fill="#FFF8E8" opacity="0.92">&amp; calorie trends; reduced manual analysis effort</text>
  <text x="74" y="452" class="body" fill="#FFF8E8" opacity="0.92">by 35% with an interactive Tableau dashboard.</text>

  <rect x="74" y="477" rx="10" width="44" height="26" fill="#F08B51" opacity="0.95"/>
  <rect x="126" y="477" rx="10" width="68" height="26" fill="#BB6653" opacity="0.95"/>
  <rect x="202" y="477" rx="10" width="72" height="26" fill="#DEE8CE" opacity="0.90"/>
  <text x="96" y="494" text-anchor="middle" class="pill" fill="#FFF8E8">SQL</text>
  <text x="160" y="494" text-anchor="middle" class="pill" fill="#FFF8E8">Python</text>
  <text x="238" y="494" text-anchor="middle" class="pill" fill="#2A1F14">Tableau</text>

  <!-- Bottom right card — Crop Irrigation -->
  <rect x="582" y="320" width="490" height="240" rx="22"
        fill="#251A10" stroke="#BB6653" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="582" y="320" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
  <text x="608" y="377" class="cardTitle" fill="#FFF8E8">🌾 Crop Irrigation Control Device</text>
  <text x="608" y="408" class="body" fill="#FFF8E8" opacity="0.92">Arduino-based automated irrigation with soil moisture,</text>
  <text x="608" y="430" class="body" fill="#FFF8E8" opacity="0.92">rain &amp; DHT11 sensors; 37.5% water usage reduction;</text>
  <text x="608" y="452" class="body" fill="#FFF8E8" opacity="0.92">Rs. 525.6B market opportunity &amp; PMKSY roadmap.</text>

  <rect x="608" y="477" rx="10" width="72" height="26" fill="#DEE8CE" opacity="0.90"/>
  <rect x="688" y="477" rx="10" width="84" height="26" fill="#F08B51" opacity="0.95"/>
  <rect x="780" y="477" rx="10" width="52" height="26" fill="#BB6653" opacity="0.95"/>
  <text x="644" y="494" text-anchor="middle" class="pill" fill="#2A1F14">Arduino</text>
  <text x="730" y="494" text-anchor="middle" class="pill" fill="#FFF8E8">Proteus 8</text>
  <text x="806" y="494" text-anchor="middle" class="pill" fill="#FFF8E8">C/C++</text>
</svg>
